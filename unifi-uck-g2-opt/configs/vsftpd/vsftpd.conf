listen=YES
# Required by the image's startup script and accounts using /sbin/nologin.
background=YES
# Match the image default for container-compatible system calls.
seccomp_sandbox=NO
check_shell=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/empty
ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
pasv_enable=YES
max_clients=10
max_per_ip=3
local_max_rate=51200
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd/xferlog
require_ssl_reuse=NO
vsftpd_log_file=/var/log/vsftpd/vsftpd.log
