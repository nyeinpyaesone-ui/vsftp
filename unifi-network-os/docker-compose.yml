version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: unifi-mongo
    restart: unless-stopped
    volumes:
      - ./db-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-unifi}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    command: mongod --bind_ip_all --quiet
    networks:
      - unifi-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-controller
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_USER=${MONGO_USER:-unifi}
      - MONGO_PASS=${MONGO_PASSWORD}
      - MEM_LIMIT=${MEM_LIMIT:-2048}
      - MEM_STARTUP=${MEM_STARTUP:-1024}
    volumes:
      - ./config:/config
      - ./storage:/storage
      - ./logs:/logs
    ports:
      - "${HOST_IP:-0.0.0.0}:8443:8443/tcp"   # Controller Web UI (HTTPS)
      - "${HOST_IP:-0.0.0.0}:8080:8080/tcp"   # Device communication
      - "${HOST_IP:-0.0.0.0}:3478:3478/udp"   # STUN
      - "${HOST_IP:-0.0.0.0}:10001:10001/udp" # Discovery
      - "${HOST_IP:-0.0.0.0}:8081:8081/tcp"   # HTTP redirect
      - "${HOST_IP:-0.0.0.0}:8843:8843/tcp"   # HTTPS portal
      - "${HOST_IP:-0.0.0.0}:6789:6789/tcp"   # Speed test
      - "${HOST_IP:-0.0.0.0}:5514:5514/udp"   # Syslog
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - unifi-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  vsftpd:
    image: fauria/vsftpd:latest
    container_name: unifi-ftp
    restart: unless-stopped
    environment:
      - FTP_USER_1=${FTP_USER:-unifi},${FTP_PASSWORD},/home/${FTP_USER:-unifi}
      - PASV_ADDRESS=${HOST_IP}
      - PASV_MIN_PORT=30000
      - PASV_MAX_PORT=30010
      - LOCAL_RATE_LIMIT=${FTP_RATE_LIMIT:-51200}
    volumes:
      - ./storage/backups:/home/${FTP_USER:-unifi}/backups
      - ./vsftpd_config:/etc/vsftpd
    ports:
      - "${HOST_IP:-0.0.0.0}:21:21/tcp"
      - "${HOST_IP:-0.0.0.0}:30000-30010:30000-30010/tcp"
    depends_on:
      - unifi-controller
    networks:
      - unifi-net
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  unifi-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  config:
  db-data:
  storage:
