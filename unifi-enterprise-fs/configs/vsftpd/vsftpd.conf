# vsftpd Configuration for UniFi Network OS Backup Storage
# Professional Grade - Secure, Rate-Limited, High-Performance

# Basic Security Settings
listen=YES
# Required by the image's startup script and accounts using /sbin/nologin.
background=YES
# Match the image default for container-compatible system calls.
seccomp_sandbox=NO
check_shell=NO
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

# User Configuration
secure_chroot_dir=/var/empty
force_dot_files=YES

# SSL/TLS Encryption (FTPS)
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH

# Performance & Rate Limiting
local_max_rate=102400
anon_max_rate=0
max_clients=20
max_per_ip=5
connect_timeout=60
data_connection_timeout=120
idle_session_timeout=600

# Passive Mode Configuration
pasv_enable=YES
pasv_promiscuous=NO

# Logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd/xferlog
xferlog_std_format=YES
log_ftp_protocol=YES
dual_log_enable=YES

# Advanced Security
hide_ids=YES
text_userdb_names=NO
setproctitle_enable=YES

# File Permissions
file_open_mode=0750
local_umask=022
chmod_enable=YES

# Directory Settings
dirmessage_enable=YES
message_file=.message
dirlist_enable=YES
ls_recurse_enable=YES

# Banners
ftpd_banner=Welcome to UniFi Network OS Backup Storage
vsftpd_log_file=/var/log/vsftpd/vsftpd.log
