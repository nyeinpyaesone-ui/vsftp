# vsftpd Configuration for UniFi Network OS Backup Storage
# Professional Grade - Secure, Rate-Limited, High-Performance

# Basic Security Settings
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

# User Configuration
local_root=/home/unifi_backup
user_sub_token=$USER
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
force_dot_files=YES

# SSL/TLS Encryption (FTPS)
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/certs/vsftpd.pem
rsa_key_file=/etc/ssl/private/vsftpd.key
require_ssl_reuse=NO
ssl_session_cache_size=10M
ssl_session_timeout=10m

# Performance & Rate Limiting
local_max_rate=102400
anon_max_rate=0
max_clients=50
max_per_ip=10
connect_timeout=60
data_connection_timeout=120
idle_session_timeout=600

# Passive Mode Configuration
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010
pasv_address=${FTP_SERVER_IP}
pasv_promiscuous=NO

# Logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES
log_ftp_protocol=YES
dual_log_enable=YES

# Advanced Security
hide_ids=YES
text_userdb_names=NO
setproctitle_enable=YES
tcp_wrappers=YES
nopriv_user=vsftpd

# File Permissions
file_open_mode=0750
local_umask=022
chmod_enable=YES

# Directory Settings
dirmessage_enable=YES
message_file=.message
dirlist_enable=YES
ls_recurse_enable=YES

# Banners
ftpd_banner=Welcome to UniFi Network OS Backup Storage
banner_file=/etc/vsftpd/banner

# Deny specific users (optional)
userlist_enable=YES
userlist_deny=NO
