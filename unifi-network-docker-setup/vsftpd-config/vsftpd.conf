# vsftpd Configuration with Rate Limiting and Security Hardening
# This configuration prevents FTP from overwhelming the UniFi server

# Allow anonymous NO - Security enforcement
anonymous_enable=NO
local_enable=YES

# Chroot jail for security
chroot_local_user=YES
allow_writeable_chroot=NO

# Passive mode settings (must match docker-compose ports)
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

# RATE LIMITING - Critical for preventing storage I/O starvation
# Limits per connection to prevent backup floods from killing DB performance
anon_max_rate=51200        # 50 KB/s for anonymous (disabled anyway)
local_max_rate=51200       # 50 KB/s for local users (FTP_USER)

# Connection limits to prevent DoS
max_clients=10             # Maximum concurrent connections
max_per_ip=3               # Max connections per IP address

# Security hardening
ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
ssl_ciphers=HIGH
require_ssl_reuse=NO
implicit_ssl=NO

# Prevent symlink attacks
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Logging for audit trail
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/vsftpd.log
dual_log_enable=YES

# Timeout settings to free resources
idle_session_timeout=300
data_connection_timeout=120

# ASCII transfers disabled for security
ascii_upload_enable=NO
ascii_download_enable=NO

# Banner customization
ftpd_banner=Welcome to UniFi Backup Storage - Rate Limited
