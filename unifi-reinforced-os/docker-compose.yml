version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # FRONTEND: Nginx Reverse Proxy (HTTP/2, SSL Termination, Compression)
  # ---------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: unifi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"  # UniFi GUI
      - "8080:8080"  # Device Gateway
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - unifi-public
      - unifi-internal
    depends_on:
      - unifi-controller
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # BACKEND: UniFi Network Application (JVM Auto-Tuned)
  # ---------------------------------------------------------------------------
  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-backend
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - MEM_LIMIT=${UNIFI_MEM_LIMIT:-2048}
      - MEM_STARTUP=${UNIFI_MEM_STARTUP:-1024}
      - MONGO_HOST=mongo-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - TZ=UTC
    volumes:
      - ./data/unifi:/config
      - ./data/shared-storage:/storage
    networks:
      - unifi-internal
    depends_on:
      - mongo-db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${UNIFI_MEM_LIMIT:-2048}M
        reservations:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # DATABASE: MongoDB (WiredTiger Optimized)
  # ---------------------------------------------------------------------------
  mongo-db:
    image: mongo:7.0
    container_name: unifi-database
    restart: unless-stopped
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB ${MONGO_CACHE_SIZE:-0.5}
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
      - MONGO_INITDB_DATABASE=unifi
    volumes:
      - ./configs/mongo/mongod.conf:/etc/mongod.conf:ro
      - ./data/mongo:/data/db
      - ./data/mongo-config:/data/configdb
    networks:
      - unifi-internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # STORAGE: vsftpd (Dynamic Rate Limiting)
  # ---------------------------------------------------------------------------
  vsftpd-storage:
    image: fauria/vsftpd
    container_name: unifi-storage
    restart: unless-stopped
    environment:
      - FTP_USER_1=${FTP_USER}:${FTP_PASS}
      - FTP_USER_2=backup:${FTP_BACKUP_PASS}
      - LOCAL_MAX_RATE=${FTP_RATE_LIMIT:-51200}
      - MAX_CLIENTS=${FTP_MAX_CLIENTS:-10}
      - MAX_PER_IP=${FTP_MAX_PER_IP:-3}
      - PASV_ADDRESS=${SERVER_IP}
      - PASV_MIN_PORT=30000
      - PASV_MAX_PORT=30010
    volumes:
      - ./data/shared-storage:/home/vsftpd/${FTP_USER}
      - ./data/backups:/home/vsftpd/backup
      - ./configs/vsftpd/vsftpd.conf:/etc/vsftpd/vsftpd.conf:ro
    ports:
      - "21:21"
      - "30000-30010:30000-30010/tcp"
    networks:
      - unifi-public
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # ORCHESTRATOR: Reinforcement Learning Engine
  # ---------------------------------------------------------------------------
  unifi-orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: unifi-orchestrator
    restart: unless-stopped
    environment:
      - SERVER_IP=${SERVER_IP}
      - LOG_LEVEL=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs/orchestrator:/app/logs
      - ./configs:/app/configs:rw
    networks:
      - unifi-internal
    privileged: true
    depends_on:
      - unifi-controller
      - mongo-db
      - vsftpd-storage
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  unifi-public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  unifi-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
