services:
  # MongoDB - Database Backend
  mongo:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: unifi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_USER: unifi
      MONGO_PASSWORD: ${MONGO_USER_PASSWORD}
    volumes:
      - ./data/db:/data/db
      - ./configs/mongo/mongod.conf:/etc/mongod.conf:ro
    command: mongod --config /etc/mongod.conf
    networks:
      - unifi-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # UniFi Network Controller - Frontend Application
  unifi:
    image: lscr.io/linuxserver/unifi-network-application:${UNIFI_VERSION:-latest}
    container_name: unifi-controller
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DBNAME: unifi
      MONGO_USERNAME: unifi
      MONGO_PASSWORD: ${MONGO_USER_PASSWORD}
      MEM_LIMIT: ${UNIFI_HEAP_SIZE:-1024}
      MEM_STARTUP: ${UNIFI_HEAP_SIZE:-1024}
    volumes:
      - ./data/unifi/data:/config
      - ./data/unifi/log:/config/log
      - ./data/shared_ftp:/backups
    ports:
      - 8443:8443   # HTTPS Web Interface
      - 8080:8080   # HTTP Portal Redirect
      - 8448:8448   # Guest Portal HTTP
      - 3478:3478/udp # STUN
      - 10001:10001/udp # Discovery
      - 1900:1900/udp # UPnP
      - 5514:5514/udp # Syslog
    depends_on:
      - mongo
    networks:
      - unifi-internal
      - unifi-frontend
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1G

  # vsftpd - Pre-configured Backup Storage Server
  vsftpd:
    image: fauria/vsftpd:${VSFTPD_VERSION:-latest}
    container_name: unifi-ftp
    restart: unless-stopped
    environment:
      FTP_USER: ${FTP_USERNAME:-unifi_backup}
      FTP_PASS: ${FTP_PASSWORD:-changeme}
      PASV_ADDRESS: ${SERVER_IP:-127.0.0.1}
      PASV_MIN_PORT: 40000
      PASV_MAX_PORT: 40100
    volumes:
      - ./data/shared_ftp:/home/${FTP_USERNAME:-unifi_backup}
      - ./configs/vsftpd.conf:/etc/vsftpd/vsftpd.conf:ro
      - ./configs/vsftpd.user_list:/etc/vsftpd.user_list:ro
    ports:
      - 21:21       # FTP Control
      - 40000-40100:40000-40100  # Passive Mode Range
    networks:
      - unifi-frontend
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  unifi-internal:
    driver: bridge
    internal: true  # Isolated network for DB ↔ App
  unifi-frontend:
    driver: bridge  # Public facing network

volumes:
  mongo-data:
  unifi-config:
  ftp-storage:
