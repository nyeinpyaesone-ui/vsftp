version: '3.8'

services:
  # MongoDB - Professional Database Layer
  mongodb:
    image: mongo:7.0
    container_name: unifi-mongodb
    restart: unless-stopped
    networks:
      - unifi-internal
    volumes:
      - ./data/db:/data/db
      - ./configs/mongo/mongod.conf:/etc/mongo/mongod.conf:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: mongod --config /etc/mongo/mongod.conf --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # UniFi Network OS - Professional Controller Backend
  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-controller
    restart: unless-stopped
    networks:
      - unifi-internal
      - unifi-frontend
    ports:
      - "${SERVER_IP}:8443:8443"   # HTTPS Management
      - "${SERVER_IP}:8080:8080"   # HTTP Portal
      - "${SERVER_IP}:3478:3478/udp" # STUN
      - "${SERVER_IP}:10001:10001/udp" # Discovery
      - "${SERVER_IP}:1900:1900/udp" # SSDP
      - "${SERVER_IP}:8843:8843"   # HTTPS Portal
      - "${SERVER_IP}:8880:8880"   # HTTP Portal Alt
    volumes:
      - ./data/unifi:/config
      - ./data/ftp-backups:/backups:rw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_AUTHSOURCE=admin
      - MEM_LIMIT=2048
      - MEM_STARTUP=1024
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://localhost:8443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 3G
        reservations:
          cpus: '1.5'
          memory: 1.5G

  # vsftpd - Professional FTP Storage Server
  vsftpd:
    image: fauria/vsftpd:latest
    container_name: unifi-ftp-server
    restart: unless-stopped
    networks:
      - unifi-frontend
    ports:
      - "${SERVER_IP}:21:21"
      - "${FTP_PASV_MIN}:${FTP_PASV_MAX}" # Passive mode ports
    volumes:
      - ./data/ftp-backups:/home/${FTP_USER}
      - ./configs/vsftpd/vsftpd.conf:/etc/vsftpd.conf:ro
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      - PASV_ADDRESS=${SERVER_IP}
      - PASV_MIN_PORT=${FTP_PASV_MIN}
      - PASV_MAX_PORT=${FTP_PASV_MAX}
    depends_on:
      - unifi-controller
    healthcheck:
      test: ["CMD", "ftp", "-N", "-o/dev/null", "ftp://localhost:21"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  unifi-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
  unifi-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
